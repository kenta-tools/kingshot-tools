<h1>⚔️ KvK相手突合せ まとめ</h1>
<div class="sub">KvKの相手鯖が決まるたびに作成した、うち（816鯖）と相手鯖の突合せ結果の一覧です。新しいものほど上に表示されます。</div>

<div class="card">
  <h2>新しい突合せを作るプロンプト</h2>
  <div class="row">
    <div class="field">
      <label>相手鯖番号（カンマ区切り）</label>
      <input type="text" id="oppKidsInput" placeholder="例: 123,456">
    </div>
    <div class="field">
      <label>表示名（省略可）</label>
      <input type="text" id="oppLabelInput" placeholder="例: 123鯖連合">
    </div>
    <div class="field">
      <label>紐づけるKVKイベント</label>
      <select id="eventSelect"><option value="">（読み込み中…）</option></select>
    </div>
    <div class="field">
      <label>突合せ人数（省略時12人）</label>
      <input type="number" id="maxRowsInput" placeholder="12" min="1">
    </div>
    <button type="button" id="makePromptBtn">プロンプトを作る</button>
  </div>
  <div class="prompt-out" id="promptOut"></div>
  <div class="row" id="promptCopyRow" style="display:none; margin-top:0;">
    <button type="button" class="copy-btn" id="copyPromptBtn">コピー</button>
  </div>
  <div class="note">ここで作ったプロンプトをClaudeに渡すと、相手鯖との突合せレポートを作成・公開します（このページ上では自動実行されません）。イベントを選ぶと、そのイベントが「完了」になるまで毎日9時に数値だけ自動更新されます。</div>
</div>

<div class="grid">
  <a class="tool-card" href="KvK相手突合せ_1065鯖_20261103.html?v=20261107153253">
    <div class="icon">⚔️</div>
    <div class="title">1065鯖</div>
    <div class="desc">12人 vs 12人の突合せ／7勝5敗</div>
    <div class="date">2026-11-07</div>
  </a>
</div>

<script src="../config.js?v=20261107153253"></script>
<script>
// GAS_URL は config.js で定義

function loadEvents() {
  const sel = document.getElementById("eventSelect");
  fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "pubGet" }) })
    .then(r => r.json())
    .then(res => {
      if (!res.ok) { sel.innerHTML = '<option value="">（読み込めませんでした）</option>'; return; }
      const events = (res.history && res.history.events || []).filter(e => e.type === "KVK" && !e.done)
        .sort((a, b) => (b.date || "").localeCompare(a.date || ""));
      sel.innerHTML = '<option value="">（紐づけない）</option>' + events.map(e =>
        `<option value="${e.id}" data-date="${e.date}">${e.date}</option>`
      ).join("");
    })
    .catch(() => { sel.innerHTML = '<option value="">（読み込めませんでした）</option>'; });
}
loadEvents();

document.getElementById("makePromptBtn").addEventListener("click", () => {
  const kids = document.getElementById("oppKidsInput").value.trim();
  const label = document.getElementById("oppLabelInput").value.trim();
  const eventSel = document.getElementById("eventSelect");
  const eventId = eventSel.value;
  const eventDate = eventId ? eventSel.selectedOptions[0].dataset.date : "";
  const maxRowsRaw = document.getElementById("maxRowsInput").value.trim();
  const maxRows = maxRowsRaw ? parseInt(maxRowsRaw, 10) : 12;
  const out = document.getElementById("promptOut");
  if (!kids) {
    out.style.display = "block";
    out.textContent = "相手鯖番号を入力してください（例: 123,456）";
    document.getElementById("promptCopyRow").style.display = "none";
    return;
  }
  let prompt = `相手鯖 ${kids} とのKvK相手突合せを作って`;
  if (label) prompt += `（表示名: ${label}）`;
  if (eventId) prompt += `（紐づけるイベント: ${eventDate}開催分、イベントID ${eventId}）`;
  prompt += `（人数: ${maxRows}人ずつ）`;
  out.style.display = "block";
  out.textContent = prompt;
  document.getElementById("promptCopyRow").style.display = "flex";
});

document.getElementById("copyPromptBtn").addEventListener("click", () => {
  const text = document.getElementById("promptOut").textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById("copyPromptBtn");
    const orig = btn.textContent;
    btn.textContent = "コピーしました";
    setTimeout(() => { btn.textContent = orig; }, 1200);
  });
});
</script>
