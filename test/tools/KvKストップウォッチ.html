<button type="button" class="ks-open-btn" onclick="ksToggleSidebar()" aria-label="メニューを開く">☰</button>
<script>
(function() {
  var collapsed = false;
  try { collapsed = localStorage.getItem("ksSidebarCollapsed") === "1"; } catch (e) {}
  function applyBtn() {
    var btn = document.getElementById("ksToggleBtn");
    if (btn) btn.textContent = document.body.classList.contains("ks-collapsed") ? "→" : "←";
  }
  if (collapsed) document.body.classList.add("ks-collapsed");
  document.addEventListener("DOMContentLoaded", applyBtn);
  applyBtn();
  window.ksToggleSidebar = function() {
    var next = !document.body.classList.contains("ks-collapsed");
    document.body.classList.toggle("ks-collapsed", next);
    try { localStorage.setItem("ksSidebarCollapsed", next ? "1" : "0"); } catch (e) {}
    applyBtn();
  };
  // スマホ幅のメニュー：☰で開閉。開いているときにメニューの外をタップしたら閉じ、そのタップは下の画面に通さない
  function setMenuOpen(open) {
    document.body.classList.toggle("ks-menu-open", open);
    document.querySelectorAll(".ks-menu-btn").forEach(function(b) {
      b.textContent = open ? "✕" : "☰";
      b.setAttribute("aria-expanded", open ? "true" : "false");
    });
  }
  function outsideMenu(t) {
    return document.body.classList.contains("ks-menu-open") && !(t.closest && (t.closest(".ks-sidebar nav") || t.closest(".ks-menu-btn")));
  }
  window.addEventListener("mousedown", function(e) { if (outsideMenu(e.target)) e.preventDefault(); }, true);
  window.addEventListener("click", function(e) {
    if (e.target.closest && e.target.closest(".ks-menu-btn")) { setMenuOpen(!document.body.classList.contains("ks-menu-open")); return; }
    if (outsideMenu(e.target)) { e.preventDefault(); e.stopPropagation(); setMenuOpen(false); }
  }, true);
})();
</script>

<div class="main">
<h1>⏱️ ストップウォッチ</h1>
<div class="sub">カウントアップ／カウントダウンを選べます。カウントダウンの秒数は、名前をつけて登録しておけます（このブラウザに保存）。</div>
<div class="card">
  <div class="mode-row">
    <label><input type="radio" name="mode" value="up" checked> カウントアップ</label>
    <label><input type="radio" name="mode" value="down"> カウントダウン</label>
    <span id="downSet" style="display:none"><input id="ss" type="number" min="0" step="1" value="60"> 秒から</span>
  </div>
  <div id="time">0.00</div>
  <button id="startBtn">スタート</button>
  <button id="resetBtn" class="sub2">リセット</button>
</div>
<div class="preset-box" id="presetBox">
  <h2>登録した秒数</h2>
  <div class="preset-form">
    名前：<input id="presetName" type="text" maxlength="20" placeholder="例：王城集結">
    <input id="presetSec" type="number" min="0" step="1" value="60"> 秒
    <button id="presetSave">登録・更新</button>
    <span style="color:#888;">（同じ名前があれば秒数を更新します）</span>
  </div>
  <table class="preset-list"><tbody id="presetList"></tbody></table>
</div>
</div>
<script>
(function () {
  var mode = "up", elapsed = 0, startAt = 0, running = false, raf = 0;
  var $ = function (id) { return document.getElementById(id); };
  function fmt(ms) {
    return (Math.floor(ms / 10) / 100).toFixed(2); // 全部秒数（小数2桁）。分には直さない
  }
  function now() { return elapsed + (running ? Date.now() - startAt : 0); }
  function intSec(v) { return Math.max(0, Math.floor(+v || 0)); } // 設定は整数の秒だけ（ミリ秒は設定しない）
  function target() { return intSec($("ss").value) * 1000; }
  function shown(e) { return mode === "down" ? Math.max(0, target() - e) : e; }
  function resetUi() {
    $("startBtn").textContent = "スタート"; $("startBtn").className = ""; $("startBtn").disabled = false; $("time").classList.remove("done");
  }
  function tick() {
    var e = now();
    if (mode === "down" && running && e >= target()) {
      elapsed = target(); running = false; cancelAnimationFrame(raf);
      $("startBtn").textContent = "再開"; $("startBtn").className = ""; $("startBtn").disabled = true; $("time").classList.add("done");
      try { var c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(); o.connect(c.destination); o.frequency.value = 880; o.start(); o.stop(c.currentTime + 0.6); } catch (x) {}
      e = target();
    }
    $("time").textContent = fmt(shown(e)); if (running) raf = requestAnimationFrame(tick);
  }
  function setMode(m) {
    if (running || elapsed > 0) { if (!confirm("計測中のタイムをリセットして切り替えます。よろしいですか？")) { document.querySelector('input[name=mode][value=' + mode + ']').checked = true; return; } }
    mode = m; running = false; cancelAnimationFrame(raf); elapsed = 0;
    $("downSet").style.display = m === "down" ? "inline" : "none"; $("presetBox").style.display = m === "down" ? "block" : "none";
    resetUi(); tick();
  }
  Array.prototype.forEach.call(document.querySelectorAll("input[name=mode]"), function (r) { r.addEventListener("change", function () { setMode(r.value); }); });
  $("ss").addEventListener("input", function () { if (!running && elapsed === 0) tick(); });
  $("startBtn").addEventListener("click", function () {
    if (!running) { running = true; startAt = Date.now(); $("startBtn").textContent = "ストップ"; $("startBtn").className = "stop"; tick(); }
    else { elapsed += Date.now() - startAt; running = false; cancelAnimationFrame(raf); $("startBtn").textContent = "再開"; $("startBtn").className = ""; tick(); }
  });
  $("resetBtn").addEventListener("click", function () {
    running = false; cancelAnimationFrame(raf); elapsed = 0; resetUi(); tick();
  });

  // --- 登録した秒数（名前が同じなら更新）。一覧から呼び出し・秒数の変更・削除ができる（このブラウザに保存） ---
  var PKEY = "kingshot_stopwatch_presets_v1";
  var presets = [];
  function loadPresets() { try { presets = JSON.parse(localStorage.getItem(PKEY) || "[]") || []; } catch (e) { presets = []; } }
  function savePresets() { try { localStorage.setItem(PKEY, JSON.stringify(presets)); } catch (e) {} }
  function callPreset(pr) {
    if (running || elapsed > 0) { alert("計測中・計測後は呼び出せません。先に「リセット」を押してください。"); return; }
    $("ss").value = pr.sec; tick();
  }
  function renderPresets() {
    var tb = $("presetList"); tb.innerHTML = "";
    if (!presets.length) { tb.innerHTML = '<tr><td class="preset-empty">まだ登録がありません。上の欄に名前と秒数を入れて「登録・更新」を押してください。</td></tr>'; return; }
    presets.forEach(function (pr, i) {
      var tr = document.createElement("tr");
      var tdN = document.createElement("td"); tdN.className = "nm"; tdN.textContent = pr.name;
      var tdS = document.createElement("td");
      var inp = document.createElement("input"); inp.type = "number"; inp.min = "0"; inp.step = "1"; inp.value = pr.sec;
      tdS.appendChild(inp); tdS.appendChild(document.createTextNode(" 秒"));
      var tdB = document.createElement("td"); tdB.style.textAlign = "right"; tdB.style.whiteSpace = "nowrap";
      var bCall = document.createElement("button"); bCall.textContent = "呼び出し";
      var bUpd = document.createElement("button"); bUpd.textContent = "更新"; bUpd.className = "sub2";
      var bDel = document.createElement("button"); bDel.textContent = "削除"; bDel.className = "sub2";
      bCall.onclick = function () { callPreset({ sec: intSec(inp.value) }); };
      bUpd.onclick = function () { pr.sec = intSec(inp.value); inp.value = pr.sec; savePresets(); renderPresets(); };
      bDel.onclick = function () { if (confirm("「" + pr.name + "」を削除します。よろしいですか？")) { presets.splice(i, 1); savePresets(); renderPresets(); } };
      tdB.appendChild(bCall); tdB.appendChild(bUpd); tdB.appendChild(bDel);
      tr.appendChild(tdN); tr.appendChild(tdS); tr.appendChild(tdB);
      tb.appendChild(tr);
    });
  }
  $("presetSave").addEventListener("click", function () {
    var name = ($("presetName").value || "").trim();
    if (!name) { alert("名前を入れてください"); return; }
    var sec = intSec($("presetSec").value);
    var found = presets.filter(function (x) { return x.name === name; })[0];
    if (found) found.sec = sec; // 名前が同じなら更新
    else {
      if (presets.length >= 30) { alert("登録できるのは30個までです。不要なものを削除してください。"); return; }
      presets.push({ name: name, sec: sec });
    }
    savePresets(); renderPresets(); $("presetName").value = "";
  });
  loadPresets(); renderPresets(); tick();
})();
</script>
