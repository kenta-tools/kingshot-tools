<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サイトの仕様まとめ</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    background: #f4f5f7;
    color: #222;
    max-width: 900px;
    margin: 32px auto;
    padding: 0 16px;
    line-height: 1.7;
  }
  .top-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; }
  .top-link { color: #2d6cdf; text-decoration: none; font-size: 14px; }
  .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-top: 16px; }
  .howto { background: #eef4ff; }
  .howto ol { margin: 6px 0 0; padding-left: 22px; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  button {
    font: inherit; font-size: 15px; font-weight: bold; padding: 10px 18px; border-radius: 8px;
    border: none; background: #2d6cdf; color: #fff; cursor: pointer;
  }
  button.sub { background: #fff; color: #2d6cdf; border: 1px solid #2d6cdf; }
  .msg { font-size: 13px; color: #1a7f37; margin-top: 8px; min-height: 1em; }
  .url { font-size: 13px; word-break: break-all; color: #555; margin-top: 8px; }
  #doc h1 { font-size: 20px; border-bottom: 2px solid #e0e4ea; padding-bottom: 4px; margin-top: 8px; }
  #doc h2 { font-size: 18px; border-left: 4px solid #2d6cdf; padding-left: 8px; margin-top: 28px; }
  #doc h3 { font-size: 16px; margin-top: 20px; }
  #doc ul, #doc ol { padding-left: 22px; }
  #doc code { background: #f0f2f5; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  #doc .table-wrap { overflow-x: auto; }
  #doc table { border-collapse: collapse; font-size: 13px; margin: 8px 0; }
  #doc th, #doc td { border: 1px solid #dde1e6; padding: 4px 8px; text-align: left; vertical-align: top; }
  #doc th { background: #f4f6f9; white-space: nowrap; }
  #doc blockquote { margin: 8px 0; padding: 6px 12px; background: #fff8e6; border-left: 4px solid #f0ad4e; }
</style>
</head>
<body>
<div class="top-row">
  <h1>📘 サイトの仕様まとめ</h1>
  <a href="../index.html?v=20261102223952" class="top-link">← TOP</a>
</div>

<div class="card howto">
  <b>AIに読み込ませて、このサイトの使い方を質問できます。</b>
  <ol>
    <li>下の「AIに渡す用にコピー」を押す</li>
    <li>ChatGPT・Claude・Gemini などのAIに貼り付けて送る</li>
    <li>続けて「出征部隊数ってどこを見ればいい？」のように質問する</li>
  </ol>
  <div class="btn-row">
    <button type="button" id="copyBtn">AIに渡す用にコピー</button>
    <button type="button" class="sub" id="copyUrlBtn">URLをコピー（URLを読めるAI向け）</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="url" id="urlText"></div>
</div>

<div class="card" id="doc">読み込み中…</div>

<script>
(function() {
  // 仕様の本文は spec.md（このページはそれを表示するだけ）。サイトを更新したら spec.md も必ず更新する
  var SRC = "spec.md";
  var PREFACE = "以下は「キングショット ツール・ランキングまとめ」サイト（https://kenta-tools.github.io/kingshot-tools/）の仕様です。" +
    "この内容をもとに、サイトの使い方についての質問に日本語でわかりやすく答えてください。書かれていないことは推測せず「仕様に書かれていません」と答えてください。\n\n";
  var text = "";
  var mdUrl = new URL(SRC, location.href).href.split("?")[0];
  document.getElementById("urlText").textContent = "仕様のURL: " + mdUrl;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function inline(s) {
    return escapeHtml(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+|[^)\s]+\.html[^)\s]*|[^)\s]+\/)\)/g, '<a href="$2">$1</a>');
  }
  // 見出し・箇条書き・番号付き・表・引用・段落だけの簡単な表示
  function render(md) {
    var out = [], lines = md.replace(/\r/g, "").split("\n"), i = 0, list = null;
    function closeList() { if (list) { out.push("</" + list + ">"); list = null; } }
    while (i < lines.length) {
      var l = lines[i], m;
      if (/^\s*$/.test(l)) { closeList(); i++; continue; }
      if ((m = /^(#{1,3})\s+(.*)$/.exec(l))) {
        closeList();
        out.push("<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">");
        i++; continue;
      }
      if (/^\|/.test(l)) {
        closeList();
        var rows = [];
        while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; }
        var cells = function(r) { return r.replace(/^\||\|$/g, "").split("|").map(function(c) { return c.trim(); }); };
        var html = '<div class="table-wrap"><table><tr>' + cells(rows[0]).map(function(c) { return "<th>" + inline(c) + "</th>"; }).join("") + "</tr>";
        rows.slice(2).forEach(function(r) {
          html += "<tr>" + cells(r).map(function(c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>";
        });
        out.push(html + "</table></div>");
        continue;
      }
      if ((m = /^>\s?(.*)$/.exec(l))) { closeList(); out.push("<blockquote>" + inline(m[1]) + "</blockquote>"); i++; continue; }
      if ((m = /^(\s*)[-*]\s+(.*)$/.exec(l)) || (m = /^(\s*)\d+\.\s+(.*)$/.exec(l))) {
        var tag = /^\s*\d+\./.test(l) ? "ol" : "ul";
        if (list !== tag) { closeList(); out.push("<" + tag + ">"); list = tag; }
        out.push("<li" + (m[1].length ? ' style="margin-left: ' + m[1].length * 8 + 'px;"' : "") + ">" + inline(m[2]) + "</li>");
        i++; continue;
      }
      closeList();
      out.push("<p>" + inline(l) + "</p>");
      i++;
    }
    closeList();
    return out.join("\n");
  }

  function copy(s, done) {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = s; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta); done();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(done, fallback);
    else fallback();
  }
  function setMsg(t) { document.getElementById("msg").textContent = t; }

  fetch(SRC + "?t=" + Date.now(), { cache: "no-store" }).then(function(r) {
    if (!r.ok) throw new Error(r.status);
    return r.text();
  }).then(function(t) {
    text = t;
    document.getElementById("doc").innerHTML = render(t);
  }).catch(function() {
    document.getElementById("doc").textContent = "読み込めませんでした。ページを開き直してください。";
  });

  document.getElementById("copyBtn").addEventListener("click", function() {
    if (!text) return setMsg("まだ読み込み中です。少し待ってからもう一度押してください。");
    copy(PREFACE + text, function() { setMsg("コピーしました。AIに貼り付けて送り、続けて質問してください。"); });
  });
  document.getElementById("copyUrlBtn").addEventListener("click", function() {
    copy(mdUrl, function() { setMsg("URLをコピーしました。「このURLの仕様を読んで使い方を教えて」とAIに送ってください。"); });
  });
})();
</script>
</body>
</html>
