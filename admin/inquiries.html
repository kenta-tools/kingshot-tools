<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>問い合わせ・質問（管理者）</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    background: #f4f5f7;
    color: #222;
    max-width: 900px;
    margin: 30px auto;
    padding: 0 16px;
    line-height: 1.7;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 24px; }
  .card { background: #fff; border-radius: 12px; padding: 18px 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 14px; }
  .q-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .q-text { font-weight: bold; font-size: 14.5px; }
  .q-meta { font-size: 12px; color: #999; white-space: nowrap; }
  .q-name { font-size: 12px; color: #888; margin-top: 2px; }
  .pill { display: inline-block; font-size: 11px; font-weight: bold; padding: 2px 9px; border-radius: 999px; margin-top: 6px; }
  .pill.done { background: #e3ede6; color: #2e6b45; }
  .pill.pending { background: #fbeecb; color: #8a5a10; }
  .answer-box { margin-top: 10px; }
  .answer-box textarea {
    width: 100%; min-height: 70px; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px;
    font-size: 13.5px; font-family: inherit; resize: vertical;
  }
  .answer-done { margin-top: 10px; background: #f6f8fb; border-radius: 8px; padding: 10px 12px; font-size: 13.5px; white-space: pre-wrap; }
  .answer-done b { color: #1a7f37; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  button {
    font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 6px;
    border: 1px solid #3a4a63; background: #1a2332; color: #fff; cursor: pointer;
  }
  button.sub { background: #fff; color: #1a2332; }
  button:disabled { opacity: 0.5; cursor: default; }
  .msg { font-size: 12.5px; min-height: 1em; }
  .msg.ok { color: #1a7f37; }
  .msg.err { color: #c0392b; }
  .empty { color: #999; font-size: 13px; }
  .filter-row { margin-bottom: 14px; }
  .filter-row label { font-size: 13px; margin-right: 14px; }

  /* ログイン画面 */
  #loginView { max-width: 360px; margin: 80px auto; text-align: center; }
  #loginView input { width: 100%; margin: 12px 0; padding: 7px 9px; border: 1px solid #ccd2db; border-radius: 6px; font-size: 14px; }
  #loginView button { width: 100%; }
  .top-link { font-size: 13px; color: #2c5cc5; text-decoration: none; }
  #appView { display: none; }
</style>
</head>
<body>

<div id="loginView" class="card">
  <h2>🔒 ログインしてください</h2>
  <div class="sub" style="margin-bottom:0;">メンバー管理画面を開くにはパスワードを入力してください（TOPページでログイン済みの同じタブなら自動で開きます）。</div>
  <input type="password" id="pwInput" placeholder="パスワード" autocomplete="current-password">
  <button type="button" id="loginBtn">ログイン</button>
  <div class="msg err" id="loginMsg"></div>
  <a href="../index.html?v=20261103160254" class="top-link" style="display: inline-block; margin-top: 8px;">← TOPページに戻る</a>
</div>

<div id="appView">
  <h1>📨 問い合わせ・質問</h1>
  <div class="sub">
    問い合わせフォーム（<a href="../inquiry/" target="_blank">inquiry/</a>）に送られた質問の一覧です。回答を入れて「保存する」を押すと、回答済みとして仕様まとめ・問い合わせページの両方に公開されます（質問者の名前は公開されません）。
  </div>

  <div class="filter-row">
    <label><input type="radio" name="filter" value="pending" checked> 未回答だけ</label>
    <label><input type="radio" name="filter" value="all"> すべて</label>
    <button type="button" class="sub" id="reloadBtn" style="margin-left:10px;">🔄 読み込み直す</button>
  </div>

  <div id="list" class="empty">読み込み中…</div>
</div>

<script>
(function() {
  "use strict";
  var PW_KEY = "ksAdminPw";
  var GAS_URL = "https://script.google.com/macros/s/AKfycbxu5HW9uLU9pCsUs1r_45xpuofWZmQAyZFDwSLK1C_7GvA7SDXZ4ayBEJTS0sR_8oToAw/exec";
  var $ = function(id) { return document.getElementById(id); };
  function on(id, evt, fn) { var el = $(id); if (el) el.addEventListener(evt, fn); }
  var inquiries = [];

  var ADMIN_NAV = [
    ["events.html", "📅", "イベント"],
    ["participants.html", "👥", "参加者一覧"],
    ["teams.html", "🧩", "チーム分け"],
    ["users.html", "🗂️", "ユーザー管理"],
    ["logs.html", "🕵️", "個人登録の記録"],
    ["inquiries.html", "📨", "問い合わせ・質問"],
  ];
  var ADMIN_SIDEBAR_CSS = [
    ".ks-sidebar { position: fixed; top: 0; left: 0; width: 220px; height: 100vh; background: #1a2332; padding: 20px 14px; box-sizing: border-box; overflow-y: auto; overflow-x: hidden; font-family: 'Segoe UI','Hiragino Kaku Gothic ProN',Meiryo,sans-serif; z-index: 99999; transition: width 0.2s ease; }",
    ".ks-title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }",
    ".ks-sidebar .ks-title { color: #fff; font-weight: bold; font-size: 14px; white-space: nowrap; flex: 1; overflow: hidden; }",
    ".ks-toggle-btn { background: transparent; border: 1px solid #3a4a63; color: #c7d0dd; border-radius: 5px; width: 24px; height: 24px; font-size: 13px; line-height: 1; cursor: pointer; flex: 0 0 auto; }",
    ".ks-toggle-btn:hover { background: #2a374d; }",
    ".ks-sidebar nav { display: flex; flex-direction: column; }",
    ".ks-sidebar .ks-link { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: 6px; margin-bottom: 2px; text-decoration: none; font-size: 12px; line-height: 1.35; color: #c7d0dd; }",
    ".ks-sidebar button.ks-link { background: none; border: none; font: inherit; width: 100%; text-align: left; cursor: pointer; }",
    ".ks-sidebar .ks-link .ks-icon { flex: 0 0 auto; width: 18px; text-align: center; margin-top: 1px; }",
    ".ks-sidebar .ks-link .ks-label { white-space: normal; overflow-wrap: break-word; }",
    ".ks-sidebar .ks-link.ks-active { background: #3a4a63; color: #fff; font-weight: bold; }",
    ".ks-sidebar .ks-group { height: 1px; background: #2a374d; margin: 10px 4px; }",
    "body.ks-collapsed .ks-sidebar .ks-group { margin: 6px 0; }",
    ".ks-open-btn { display: none; position: fixed; top: 14px; left: 14px; z-index: 100001; width: 34px; height: 34px; border-radius: 8px; border: none; background: #1a2332; color: #fff; font-size: 16px; cursor: pointer; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,0.25); }",
    "body.has-admin-sidebar { margin-left: 240px !important; transition: margin-left 0.2s ease; }",
    "body.has-admin-sidebar.ks-collapsed { margin-left: 76px !important; }",
    "body.ks-collapsed .ks-sidebar { width: 56px; padding-left: 8px; padding-right: 8px; }",
    "body.ks-collapsed .ks-sidebar .ks-title { display: none; }",
    "body.ks-collapsed .ks-title-row { justify-content: center; }",
    "body.ks-collapsed .ks-sidebar .ks-label { display: none; }",
    "body.ks-collapsed .ks-sidebar .ks-link { justify-content: center; padding: 8px 0; }",
    "@media (max-width: 760px) {",
    "  .ks-sidebar { width: 100% !important; height: auto; max-height: none; top: 0; left: 0; padding: 8px 10px !important; overflow-y: hidden; display: flex; align-items: center; gap: 8px; transition: transform 0.2s ease; }",
    "  .ks-title-row { margin-bottom: 0; }",
    "  .ks-sidebar .ks-title { font-size: 12px; flex: 0 0 auto; }",
    "  .ks-sidebar nav { flex-direction: row; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; gap: 4px; }",
    "  .ks-sidebar .ks-link { flex: 0 0 auto; white-space: nowrap; margin-bottom: 0; padding: 6px 10px; font-size: 12px; }",
    "  .ks-sidebar .ks-label { display: inline !important; }",
    "  .ks-sidebar .ks-group { display: none; }",
    "  body.has-admin-sidebar { margin-left: 0 !important; padding-top: 56px !important; }",
    "  body.has-admin-sidebar.ks-collapsed .ks-sidebar { transform: translateY(-100%); width: 100% !important; }",
    "  body.has-admin-sidebar.ks-collapsed { margin-left: 0 !important; padding-top: 0 !important; }",
    "  body.ks-collapsed .ks-open-btn { display: flex; }",
    "  .ks-open-btn { top: 8px; left: 8px; }",
    "}",
  ].join("\n");

  function renderAdminSidebar() {
    if ($("ksAdminSidebar")) return;
    var here = location.pathname.split("/").pop();
    var links = ADMIN_NAV.map(function(item) {
      var active = item[0] === here;
      return '<a href="' + item[0] + '" class="ks-link' + (active ? " ks-active" : "") + '" title="' + item[2] + '">' +
        '<span class="ks-icon">' + item[1] + '</span><span class="ks-label">' + item[2] + "</span></a>";
    }).join("");

    var style = document.createElement("style");
    style.textContent = ADMIN_SIDEBAR_CSS;
    document.head.appendChild(style);

    var wrap = document.createElement("div");
    wrap.innerHTML =
      '<div class="ks-sidebar" id="ksAdminSidebar">' +
        '<div class="ks-title-row"><span class="ks-title">🔐 管理画面</span>' +
          '<button type="button" class="ks-toggle-btn" id="ksToggleBtn">←</button></div>' +
        "<nav>" + links +
          '<div class="ks-group"></div>' +
          '<a href="../kvk-matchup/kvk-matchup-index.html?v=20261103160254" class="ks-link" title="KvK相手突合せ"><span class="ks-icon">⚔️</span><span class="ks-label">KvK相手突合せ</span></a>' +
          '<a href="../index.html?v=20261103160254" class="ks-link" title="TOP"><span class="ks-icon">🏠</span><span class="ks-label">TOP</span></a>' +
          '<button type="button" class="ks-link" id="logoutBtn" title="ログアウト"><span class="ks-icon">🚪</span><span class="ks-label">ログアウト</span></button>' +
        "</nav>" +
      "</div>" +
      '<button type="button" class="ks-open-btn" id="ksOpenBtn" aria-label="メニューを開く">☰</button>';
    while (wrap.firstChild) $("appView").insertBefore(wrap.firstChild, $("appView").firstChild);
    document.body.classList.add("has-admin-sidebar");

    var collapsed = false;
    try { collapsed = localStorage.getItem("ksAdminSidebarCollapsed") === "1"; } catch (e) {}
    function applyBtn() {
      var btn = $("ksToggleBtn");
      if (btn) btn.textContent = document.body.classList.contains("ks-collapsed") ? "→" : "←";
    }
    if (collapsed) document.body.classList.add("ks-collapsed");
    applyBtn();
    function toggle() {
      var next = !document.body.classList.contains("ks-collapsed");
      document.body.classList.toggle("ks-collapsed", next);
      try { localStorage.setItem("ksAdminSidebarCollapsed", next ? "1" : "0"); } catch (e) {}
      applyBtn();
    }
    on("ksToggleBtn", "click", toggle);
    on("ksOpenBtn", "click", toggle);
  }

  function isAuthed() {
    try { return !!sessionStorage.getItem(PW_KEY); } catch (e) { return false; }
  }
  function adminPassword() {
    try { return sessionStorage.getItem(PW_KEY) || ""; } catch (e) { return ""; }
  }

  function gasCall(payload) {
    payload.password = adminPassword();
    return fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
      .then(function(r) { return r.json(); });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function formatTime(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d)) return "";
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  function currentFilter() {
    var r = document.querySelector('input[name="filter"]:checked');
    return r ? r.value : "pending";
  }

  function render() {
    var filter = currentFilter();
    var shown = filter === "pending" ? inquiries.filter(function(i) { return !i.answered; }) : inquiries;
    var list = $("list");
    if (!shown.length) {
      list.className = "empty";
      list.textContent = filter === "pending" ? "未回答の質問はありません。" : "まだ質問がありません。";
      return;
    }
    list.className = "";
    list.innerHTML = shown.map(function(i) {
      var meta = formatTime(i.createdAt) + (i.name ? "" : "");
      var body = '<div class="card" data-id="' + escapeHtml(i.id) + '">' +
        '<div class="q-head"><div class="q-text">' + escapeHtml(i.text) + '</div><div class="q-meta">' + escapeHtml(meta) + '</div></div>' +
        (i.name ? '<div class="q-name">お名前: ' + escapeHtml(i.name) + '</div>' : '') +
        '<span class="pill ' + (i.answered ? "done" : "pending") + '">' + (i.answered ? "回答済み" : "未回答") + '</span>';
      if (i.answered) {
        body += '<div class="answer-done"><b>回答</b>（' + escapeHtml(formatTime(i.answeredAt)) + '）<br>' + escapeHtml(i.answerText) + '</div>';
      } else {
        body += '<div class="answer-box">' +
          '<textarea placeholder="回答を入力…" class="answer-input"></textarea>' +
          '<div class="row"><button type="button" class="save-answer-btn">この回答を保存</button><span class="msg" ></span></div>' +
          '</div>';
      }
      body += '</div>';
      return body;
    }).join("");

    list.querySelectorAll(".save-answer-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var card = btn.closest(".card");
        var id = card.dataset.id;
        var textarea = card.querySelector(".answer-input");
        var msg = card.querySelector(".msg");
        var answerText = textarea.value.trim();
        if (!answerText) { msg.className = "msg err"; msg.textContent = "回答を入力してください"; return; }
        btn.disabled = true;
        msg.className = "msg";
        msg.textContent = "保存中…";
        gasCall({ action: "answerInquiry", id: id, answerText: answerText }).then(function(res) {
          if (!res.ok) throw new Error(res.error || "保存できませんでした");
          var rec = inquiries.filter(function(x) { return x.id === id; })[0];
          if (rec) { rec.answered = true; rec.answerText = answerText; rec.answeredAt = new Date().toISOString(); }
          render();
        }).catch(function(e) {
          msg.className = "msg err";
          msg.textContent = "保存できませんでした: " + e.message;
          btn.disabled = false;
        });
      });
    });
  }

  function loadInquiries() {
    $("list").className = "empty";
    $("list").textContent = "読み込み中…";
    gasCall({ action: "getInquiries" }).then(function(res) {
      if (!res.ok) throw new Error(res.error || "読み込めませんでした");
      inquiries = res.inquiries || [];
      render();
    }).catch(function(e) {
      $("list").textContent = "読み込めませんでした: " + e.message;
    });
  }

  document.querySelectorAll('input[name="filter"]').forEach(function(r) { r.addEventListener("change", render); });
  on("reloadBtn", "click", loadInquiries);

  function showApp() {
    $("loginView").style.display = "none";
    $("appView").style.display = "block";
    renderAdminSidebar();
    loadInquiries();
  }

  function tryLogin() {
    var pw = $("pwInput").value;
    if (!pw) return;
    $("loginBtn").disabled = true;
    $("loginMsg").textContent = "確認中…";
    fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "get", password: pw }) })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res.ok) {
          try { sessionStorage.setItem(PW_KEY, pw); } catch (e) {}
          $("loginMsg").textContent = "";
          showApp();
        } else if (res.status === 401) {
          $("loginMsg").textContent = "パスワードが違います";
          $("pwInput").select();
        } else {
          $("loginMsg").textContent = "確認できませんでした（" + (res.error || res.status) + "）";
        }
      })
      .catch(function() {
        $("loginMsg").textContent = "接続できませんでした。時間をおいてもう一度試してください";
      })
      .then(function() { $("loginBtn").disabled = false; });
  }

  on("loginBtn", "click", tryLogin);
  on("pwInput", "keydown", function(e) { if (e.key === "Enter") tryLogin(); });
  on("logoutBtn", "click", function() {
    try { sessionStorage.removeItem(PW_KEY); } catch (e) {}
    location.reload();
  });

  if (isAuthed()) showApp();
  else $("pwInput").focus();
})();
</script>
</body>
</html>
