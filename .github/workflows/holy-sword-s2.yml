# 聖剣リーグ Season2（第14〜16ブロック）の自動更新。
# 2026-11-06より前: 何もしない。2026-11-06: 名簿を確定して初回生成。以降毎日: 数値だけ再取得して同じファイルに上書き。
# 中身は .github/scripts/holy_sword_s2_refresh.py
name: 聖剣リーグ Season2 自動更新

on:
  schedule:
    - cron: "0 0 * * *" # 毎日 00:00 UTC ＝ 日本時間 9:00（混雑で数十分遅れることがある）
  workflow_dispatch: {} # Actions の画面から手動でも実行できる

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: データを更新
        env:
          MIGHTPULSE_API_KEY: ${{ secrets.MIGHTPULSE_API_KEY }}
        run: python3 .github/scripts/holy_sword_s2_refresh.py
      - name: 変更をコミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add holy-sword-league/Season2 holy-sword-league/holy-sword-league-index.html .github/data/holy-sword-s2
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "聖剣リーグ Season2: 自動更新 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
