<script>
// --- タブ（複数の周期ウェーブタイマーを切り替えて使う） ---
// 既存ユーザーの保存データを引き継ぐため、最初のタブは特別扱いで従来のキー名（接尾辞なし）を使う。
const TABS_KEY = "waveTimerTabs";
const CURRENT_TAB_KEY = "waveTimerCurrentTab";
const DEFAULT_TAB_ID = "default";
let tabs = [{ id: DEFAULT_TAB_ID, title: "タイマー1" }];
let currentTabId = DEFAULT_TAB_ID;

function settingsKeyFor(id) { return id === DEFAULT_TAB_ID ? "waveTimerSettings" : "waveTimerSettings_" + id; }
function pasteKeyFor(id) { return id === DEFAULT_TAB_ID ? "waveTimerPastedTimeline" : "waveTimerPastedTimeline_" + id; }
function sideHiddenKeyFor(id) { return id === DEFAULT_TAB_ID ? "waveTimerSideHidden" : "waveTimerSideHidden_" + id; }

function loadTabs() {
  try {
    const raw = localStorage.getItem(TABS_KEY);
    const saved = raw ? JSON.parse(raw) : null;
    if (Array.isArray(saved) && saved.length) tabs = saved;
  } catch (e) {}
  try {
    const savedCurrent = localStorage.getItem(CURRENT_TAB_KEY);
    if (savedCurrent && tabs.some(t => t.id === savedCurrent)) currentTabId = savedCurrent;
  } catch (e) {}
}

function saveTabs() {
  try {
    localStorage.setItem(TABS_KEY, JSON.stringify(tabs));
    localStorage.setItem(CURRENT_TAB_KEY, currentTabId);
  } catch (e) {}
}

function escapeAttr(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : str;
  return div.innerHTML.replace(/"/g, "&quot;");
}

function renderTabBar() {
  const bar = document.getElementById("tabBar");
  bar.innerHTML = "";
  tabs.forEach(tab => {
    const el = document.createElement("div");
    el.className = "tab-item" + (tab.id === currentTabId ? " active" : "");
    el.innerHTML = `
      <input type="text" class="tab-title-input" data-id="${tab.id}" value="${escapeAttr(tab.title)}" size="${Math.max(2, tab.title.length)}">
      ${tabs.length > 1 ? `<span class="tab-close" data-id="${tab.id}" title="このタブを削除">×</span>` : ""}
    `;
    el.querySelector(".tab-title-input").addEventListener("click", (e) => {
      if (tab.id !== currentTabId) switchToTab(tab.id);
    });
    el.querySelector(".tab-title-input").addEventListener("input", (e) => {
      tab.title = e.target.value;
      e.target.size = Math.max(2, e.target.value.length);
      saveTabs();
    });
    const closeEl = el.querySelector(".tab-close");
    if (closeEl) {
      closeEl.addEventListener("click", (e) => {
        e.stopPropagation();
        deleteTab(tab.id);
      });
    }
    bar.appendChild(el);
  });
  const addBtn = document.createElement("button");
  addBtn.type = "button";
  addBtn.className = "tab-add";
  addBtn.textContent = "+";
  addBtn.title = "タブを追加";
  addBtn.addEventListener("click", addTab);
  bar.appendChild(addBtn);
}

function addTab() {
  const n = tabs.length + 1;
  const id = "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  tabs.push({ id, title: "タイマー" + n });
  saveTabs();
  switchToTab(id);
}

function deleteTab(id) {
  if (tabs.length <= 1) return;
  if (!confirm("このタブを削除します。保存されている内容も消えます。よろしいですか？")) return;
  tabs = tabs.filter(t => t.id !== id);
  try {
    localStorage.removeItem(settingsKeyFor(id));
    localStorage.removeItem(pasteKeyFor(id));
    localStorage.removeItem(sideHiddenKeyFor(id));
  } catch (e) {}
  saveTabs();
  if (currentTabId === id) switchToTab(tabs[0].id);
  else renderTabBar();
}

function switchToTab(id) {
  if (id === currentTabId) return;
  if (running || hasStarted) {
    if (!confirm("動いているタイマーを止めてタブを切り替えます。よろしいですか？")) return;
  }
  resetTimerState();
  currentTabId = id;
  saveTabs();
  renderTabBar();
  loadSettings();
  try { applySideHidden(localStorage.getItem(sideHiddenKeyFor(currentTabId)) === "1"); } catch (e) {}
  loadPasteBox();
  reparseTimeline();
}

let running = false;
let items = []; // {num, start(ms, performance.now), remaining}
let itemCounter = 0;
let spawnTimeoutId = null;
let rafId = null;
let period = 10;
let maxLife = 30;
let extraDisplaySec = 3;
let pausedAt = null; // ストップした瞬間のperformance.now()（表示を凍結するため）
let hasStarted = false;

function getRefNow() {
  if (running) return performance.now();
  if (pausedAt !== null) return pausedAt;
  return performance.now();
}

const periodMinInput = document.getElementById("periodMin");
const periodSecInput = document.getElementById("periodSec");
const maxMinInput = document.getElementById("maxMin");
const maxSecInput = document.getElementById("maxSec");
const extraDisplayInput = document.getElementById("extraDisplaySec");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const resetBtn = document.getElementById("resetBtn");
const itemStack = document.getElementById("itemStack");
const emptyMsg = document.getElementById("emptyMsg");

function formatElapsed(sec) {
  const sign = sec < 0 ? "-" : "";
  const totalMs = Math.abs(sec) * 1000;
  const minutes = Math.floor(totalMs / 60000);
  const seconds = Math.floor((totalMs % 60000) / 1000);
  const tenths = Math.floor((totalMs % 1000) / 100);
  const pad = n => String(n).padStart(2, "0");
  return `${sign}${pad(minutes)}:${pad(seconds)}.${tenths}`;
}

let baseTime = 0; // スタートを押した瞬間のperformance.now()

function scheduleSpawn(k) {
  // k = 1始まりの予定番号。baseTimeからの絶対時刻で狙いを定め、そこから「今」を引いた分だけ待つ
  // （相対時間の積み上げにしない。前は先出し表示のためのリード時間があったが廃止）。
  const nominalOffsetMs = (k - 1) * period * 1000;
  const targetFireTime = baseTime + nominalOffsetMs;
  const fireDelay = Math.max(0, targetFireTime - performance.now());
  spawnTimeoutId = setTimeout(() => {
    if (!running) return;
    itemCounter += 1;
    const nominalStart = baseTime + nominalOffsetMs;
    items.push({ num: itemCounter, start: nominalStart, remaining: maxLife });
    scheduleSpawn(k + 1);
  }, fireDelay);
}

function loopRender() {
  const now = getRefNow();
  items.forEach(it => {
    it.remaining = maxLife - (now - it.start) / 1000;
  });
  items = items.filter(it => it.remaining > -extraDisplaySec);

  renderTimelineStatus();
  renderStack();

  if (running) {
    rafId = requestAnimationFrame(loopRender);
  } else {
    rafId = null;
  }
}

function renderUpcomingLaunch() {
  const box = document.getElementById("upcomingLaunchBox");
  if (!upcomingLaunch || !upcomingLaunch.length) {
    box.style.display = "none";
    return;
  }
  box.style.display = "block";
  box.innerHTML = upcomingLaunch.map(g => {
    const altsHtml = g.alts.length > 1
      ? `<div class="alt-rally">出せなかったら時短：${g.alts.map(a =>
          `<span class="${a.isOriginal ? "alt-original" : ""}">${a.min}分集結なら${a.remain}秒後</span>`
        ).join(" ／ ")}</div>`
      : "";
    return `<div class="upcoming-item">⏱ <span class="remain">${g.remain}秒後</span>：${g.names.join("、")}${altsHtml}</div>`;
  }).join("");
}

function renderMissedLaunches() {
  const box = document.getElementById("missedLaunchBox");
  if (!missedLaunches || !missedLaunches.length) {
    box.style.display = "none";
    box.innerHTML = "";
    return;
  }
  box.style.display = "block";
  box.innerHTML = missedLaunches.map((g, i) => {
    const btnsHtml = g.alts.length
      ? `<div class="alt-btn-row">${g.alts.map(a =>
          `<button type="button" class="alt-btn" data-group="${i}" data-min="${a.min}">${a.min}分集結で出す（${a.remain}秒後）</button>`
        ).join("")}</div>`
      : "";
    return `<div class="missed-item"><div class="missed-label">⚠ ${g.elapsedSince}秒前に発起予定だった：${g.names.join("、")}</div>${btnsHtml}</div>`;
  }).join("");
  box.querySelectorAll(".alt-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const g = missedLaunches[parseInt(btn.dataset.group, 10)];
      applyRallyOverride(g.keys, parseInt(btn.dataset.min, 10));
    });
  });
}

function renderStack() {
  renderUpcomingLaunch();
  renderMissedLaunches();
  const sorted = [...items].sort((a, b) => a.num - b.num);
  itemStack.innerHTML = "";
  emptyMsg.style.display = sorted.length ? "none" : "block";
  sorted.forEach((it, index) => {
    const div = document.createElement("div");
    const numText = formatElapsed(maxLife - it.remaining);
    if (index === 0) {
      div.className = "item-card with-timeline";
      const patternsHtml = activePatternHeaders.length
        ? activePatternHeaders.map(h => `<div class="pattern-block-item">${h}</div>`).join("")
        : (timelineBlocks.length ? "" : `<div class="empty-note">タイムラインのテキストが貼り付けられていません</div>`);
      div.innerHTML = `
        <div class="item-label">${index + 1}個目</div>
        <div class="item-num-wrap"><div class="item-num">${numText}</div></div>
        <div class="item-timeline">${patternsHtml}</div>
      `;
    } else {
      div.className = "item-card";
      div.innerHTML = `
        <div class="item-label">${index + 1}個目</div>
        <div class="item-num">${numText}</div>
      `;
    }
    itemStack.appendChild(div);
  });

  if (waitingPatterns.length > 0) {
    const minRemain = Math.min(...waitingPatterns.map(w => w.remain));
    const listHtml = waitingPatterns.map(w => `<div class="pattern-block-item">${w.header}</div>`).join("");
    const div = document.createElement("div");
    div.className = "item-card with-timeline";
    div.innerHTML = `
      <div class="item-label">2周目</div>
      <div class="item-num-wrap"><div class="item-num">${formatElapsed(-minRemain)}</div></div>
      <div class="item-timeline">${listHtml}</div>
    `;
    itemStack.appendChild(div);
  }
}

function readMinSec(minInput, secInput) {
  const min = parseInt(minInput.value, 10) || 0;
  const sec = parseInt(secInput.value, 10) || 0;
  return min * 60 + sec;
}

function setInputsDisabled(disabled) {
  periodMinInput.disabled = disabled;
  periodSecInput.disabled = disabled;
  maxMinInput.disabled = disabled;
  maxSecInput.disabled = disabled;
  extraDisplayInput.disabled = disabled;
}

// --- 設定値の自動保存（タブごと・このブラウザのみ） ---
const settingInputs = [periodMinInput, periodSecInput, maxMinInput, maxSecInput, extraDisplayInput];

function saveSettings() {
  try {
    const data = {};
    settingInputs.forEach(el => { data[el.id] = el.value; });
    localStorage.setItem(settingsKeyFor(currentTabId), JSON.stringify(data));
  } catch (e) {}
}

const DEFAULT_SETTINGS = { periodMin: "0", periodSec: "10", maxMin: "0", maxSec: "30", extraDisplaySec: "3" };

function loadSettings() {
  settingInputs.forEach(el => { el.value = DEFAULT_SETTINGS[el.id]; });
  try {
    const raw = localStorage.getItem(settingsKeyFor(currentTabId));
    if (!raw) return;
    const data = JSON.parse(raw);
    settingInputs.forEach(el => {
      if (data[el.id] !== undefined) el.value = data[el.id];
    });
  } catch (e) {}
}

settingInputs.forEach(el => el.addEventListener("input", saveSettings));

startBtn.addEventListener("click", () => {
  if (running) return;
  period = Math.max(1, readMinSec(periodMinInput, periodSecInput));
  maxLife = Math.max(1, readMinSec(maxMinInput, maxSecInput));
  extraDisplaySec = Math.max(0, parseInt(extraDisplayInput.value, 10) || 0);
  running = true;
  pausedAt = null;
  hasStarted = true;
  items = [];
  itemCounter = 0;
  startBtn.disabled = true;
  stopBtn.disabled = false;
  setInputsDisabled(true);
  baseTime = performance.now();
  scheduleSpawn(1);
  if (!rafId) rafId = requestAnimationFrame(loopRender);
});

stopBtn.addEventListener("click", () => {
  running = false;
  pausedAt = performance.now();
  clearTimeout(spawnTimeoutId);
  startBtn.disabled = false;
  stopBtn.disabled = true;
  setInputsDisabled(false);
  renderTimelineStatus();
  renderStack();
});

function resetTimerState() {
  running = false;
  pausedAt = null;
  hasStarted = false;
  clearTimeout(spawnTimeoutId);
  cancelAnimationFrame(rafId);
  rafId = null;
  items = [];
  itemCounter = 0;
  startBtn.disabled = false;
  stopBtn.disabled = true;
  setInputsDisabled(false);
  renderTimelineStatus();
  renderStack();
}

resetBtn.addEventListener("click", resetTimerState);

// --- 右側：炎龍タイムライン結果の貼り付け欄（タブごと・このブラウザのlocalStorageに自動保存） ---
const pasteBox = document.getElementById("pasteBox");
const saveStatus = document.getElementById("saveStatus");
let saveStatusTimer = null;

const PASTE_MAX_FONT = 16;
const PASTE_MIN_FONT = 8;

function fitPasteBoxFont() {
  let fontSize = PASTE_MAX_FONT;
  pasteBox.style.fontSize = fontSize + "px";
  while (pasteBox.scrollHeight > pasteBox.clientHeight && fontSize > PASTE_MIN_FONT) {
    fontSize -= 1;
    pasteBox.style.fontSize = fontSize + "px";
  }
}

function loadPasteBox() {
  try {
    const saved = localStorage.getItem(pasteKeyFor(currentTabId));
    pasteBox.value = saved !== null ? saved : "";
  } catch (e) {
    // localStorageが使えない環境では何もしない
  }
  fitPasteBoxFont();
}

window.addEventListener("resize", fitPasteBoxFont);

// --- 貼り付け欄の表示/非表示（隠すとタイマー側が横いっぱいに広がる） ---
const colSideEl = document.getElementById("colSide");
const hideSideBtn = document.getElementById("hideSideBtn");

function applySideHidden(hidden) {
  colSideEl.style.display = hidden ? "none" : "";
  hideSideBtn.textContent = hidden ? "貼り付け欄を表示" : "貼り付け欄を隠す";
}

hideSideBtn.addEventListener("click", () => {
  const hidden = colSideEl.style.display !== "none";
  applySideHidden(hidden);
  try { localStorage.setItem(sideHiddenKeyFor(currentTabId), hidden ? "1" : "0"); } catch (e) {}
  setTimeout(fitPasteBoxFont, 0);
});

function savePasteBox() {
  try {
    localStorage.setItem(pasteKeyFor(currentTabId), pasteBox.value);
    saveStatus.textContent = "保存しました";
  } catch (e) {
    saveStatus.textContent = "この環境では保存できません";
  }
  clearTimeout(saveStatusTimer);
  saveStatusTimer = setTimeout(() => { saveStatus.textContent = " "; }, 1500);
}

pasteBox.addEventListener("input", () => {
  fitPasteBoxFont();
  savePasteBox();
  reparseTimeline();
});

// --- 炎龍 集結タイムライン計算の結果を自動取り込み（周期・MAXの手入力を不要にする） ---
const SIEGE_DATA_KEY = "siegeTimelineForWaveTimer";
let lastAppliedSiegeSavedAt = null;

function applySiegeData(data) {
  if (typeof data.periodSec === "number" && data.periodSec > 0) {
    periodMinInput.value = Math.floor(data.periodSec / 60);
    periodSecInput.value = Math.round(data.periodSec % 60);
  }
  if (typeof data.maxSec === "number" && data.maxSec > 0) {
    maxMinInput.value = Math.floor(data.maxSec / 60);
    maxSecInput.value = Math.round(data.maxSec % 60);
  }
  if (typeof data.rawText === "string" && data.rawText) {
    pasteBox.value = data.rawText;
  }
  saveSettings();
  savePasteBox();
  fitPasteBoxFont();
  reparseTimeline();
  saveStatus.textContent = "攻城タイムライン計算の結果を自動取得しました";
  clearTimeout(saveStatusTimer);
  saveStatusTimer = setTimeout(() => { saveStatus.textContent = " "; }, 2500);
}

function autoSyncSiegeData() {
  if (running) return; // 計測中は設定を書き換えない
  try {
    const raw = localStorage.getItem(SIEGE_DATA_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (!data || data.savedAt === lastAppliedSiegeSavedAt) return;
    lastAppliedSiegeSavedAt = data.savedAt;
    applySiegeData(data);
  } catch (e) {}
}

window.addEventListener("storage", (e) => {
  if (e.key === SIEGE_DATA_KEY) autoSyncSiegeData();
});

// --- タイムライン進行状況：貼り付けたテキスト（1週分）を無限ループとして扱う。
//     ①②③...の最後のパターンが終わったら、また最初のパターンから繰り返す。
//     進行中は未終了のパターンだけ表示。全部終わった瞬間（ループの境目）だけ全パターンを表示。 ---
let timelineBlocks = []; // [{header, startSec, endSec}]
let timelineLines = []; // [{symbol, label, launchSec}] パターンでまとめず、1行＝1人の発起時刻のまま持つ
let activePatternHeaders = [];
let waitingPatterns = []; // [{header, numText}] 次の周を待っているパターン（大きな時計カードで表示）
let upcomingLaunch = null; // [{remain, names}] 1分以内に発起する人がいるときだけ、早い順にセットする
let missedLaunches = null; // [{key, names, rallyMin, alts}] 発起時刻を過ぎてから1分以内の人
let currentCycleIndex = 0; // 今が何周目か（0始まり）。時短オプションのボタンを押したときに使う
// 「出せなかったので時短で出す」を選んだ記録。キー=symbol+label、値={cycleIndex, rallyMin}。
// 周回（cycleIndex）が変わると自動的に効かなくなる（次の周では元の集結時間に戻る）。
let rallyOverrides = {};
let parsedCycleLen = null; // テキスト内の「周期：」の行から読み取った、本当の1周の長さ（秒）
const UPCOMING_LAUNCH_WINDOW_SEC = 60;
const ALT_RALLY_MINUTES = [1, 3, 5]; // 出せなかったときの時間短縮オプション（集結時間の候補）

function parseCycleLength(text) {
  const m = text.match(/周期[：:]\s*(\d{1,3})分(\d{1,2})秒/) || text.match(/周期[：:]\s*(\d{1,3}):(\d{2})/);
  if (!m) return null;
  return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
}

// 「0分0秒 → ①A（5分集結）※行軍40秒（5分40秒着、6分20秒帰還）」のように、
// 発起時刻が早い順に並んだ1行1アクション形式（炎龍 集結タイムライン計算の出力）をパースする。
// 同じパターン記号（①②③…）を含む行をまとめて1ブロックとし、発起〜帰還の最も早い/遅い時刻を範囲とする。
function parseTimeline(text) {
  const SYMBOL_RE = /[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]/;
  const leadTimeRe = /^(\d{1,3})分(\d{1,2})秒|^(\d{1,3}):(\d{2})/;
  const retTimeRe = /(\d{1,3})分(\d{1,2})秒帰還|(\d{1,3}):(\d{2})帰還/;
  const blockMap = new Map();
  const order = [];
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) continue;
    const leadM = line.match(leadTimeRe);
    const arrowIdx = line.indexOf("→");
    if (!leadM || arrowIdx === -1) continue;
    const symM = line.slice(arrowIdx + 1).match(SYMBOL_RE);
    if (!symM) continue;
    const symbol = symM[0];
    const launchSec = leadM[1] !== undefined
      ? parseInt(leadM[1], 10) * 60 + parseInt(leadM[2], 10)
      : parseInt(leadM[3], 10) * 60 + parseInt(leadM[4], 10);
    const retM = line.match(retTimeRe);
    const retSec = retM
      ? (retM[1] !== undefined ? parseInt(retM[1], 10) * 60 + parseInt(retM[2], 10) : parseInt(retM[3], 10) * 60 + parseInt(retM[4], 10))
      : launchSec;
    const labelM = line.slice(arrowIdx + 1 + symM.index + symbol.length).match(/^([^（(]*)/);
    const label = labelM ? labelM[1].trim() : "";

    if (!blockMap.has(symbol)) {
      blockMap.set(symbol, { symbol, labels: new Set(), startSec: launchSec, endSec: retSec });
      order.push(symbol);
    }
    const b = blockMap.get(symbol);
    if (label) b.labels.add(label);
    if (launchSec < b.startSec) b.startSec = launchSec;
    if (retSec > b.endSec) b.endSec = retSec;
  }
  return order.map(s => {
    const b = blockMap.get(s);
    const labelsText = Array.from(b.labels).join("+");
    return { header: labelsText ? `${b.symbol}${labelsText}` : b.symbol, startSec: b.startSec, endSec: b.endSec };
  });
}

// parseTimelineと同じ行を、パターンでまとめず1行＝1人のまま返す（「次に発起する人」の判定用）
function parseTimelineLines(text) {
  const SYMBOL_RE = /[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]/;
  const leadTimeRe = /^(\d{1,3})分(\d{1,2})秒|^(\d{1,3}):(\d{2})/;
  const lines = [];
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) continue;
    const leadM = line.match(leadTimeRe);
    const arrowIdx = line.indexOf("→");
    if (!leadM || arrowIdx === -1) continue;
    const symM = line.slice(arrowIdx + 1).match(SYMBOL_RE);
    if (!symM) continue;
    const symbol = symM[0];
    const launchSec = leadM[1] !== undefined
      ? parseInt(leadM[1], 10) * 60 + parseInt(leadM[2], 10)
      : parseInt(leadM[3], 10) * 60 + parseInt(leadM[4], 10);
    const labelM = line.slice(arrowIdx + 1 + symM.index + symbol.length).match(/^([^（(]*)/);
    const label = labelM ? labelM[1].trim() : "";
    const rallyM = line.match(/[（(](\d{1,3})分集結[）)]/);
    const rallyMin = rallyM ? parseInt(rallyM[1], 10) : null;
    lines.push({ symbol, label, launchSec, rallyMin });
  }
  lines.sort((a, b) => a.launchSec - b.launchSec);
  return lines;
}

function reparseTimeline() {
  timelineBlocks = parseTimeline(pasteBox.value);
  timelineLines = parseTimelineLines(pasteBox.value);
  parsedCycleLen = parseCycleLength(pasteBox.value);
  renderTimelineStatus();
  renderStack();
}

function renderTimelineStatus() {
  const elapsedSec = hasStarted ? (getRefNow() - baseTime) / 1000 : 0;
  activePatternHeaders = [];
  waitingPatterns = [];
  upcomingLaunch = null;
  missedLaunches = null;
  if (timelineBlocks.length === 0) return;

  const firstStart = Math.min(...timelineBlocks.map(b => b.startSec));
  const lastEnd = Math.max(...timelineBlocks.map(b => b.endSec));
  if (elapsedSec < firstStart) return; // まだ1周目も始まっていない

  // 「周期：」の行があればそれを優先（行軍・帰還・クールダウンを含む本当の1周の長さ）。
  // 無ければ発起時刻の範囲から簡易計算（フォールバック）。
  const cycleLen = Math.max(1, parsedCycleLen !== null ? parsedCycleLen : (lastEnd - firstStart));
  const cyclePos = firstStart + ((elapsedSec - firstStart) % cycleLen);

  // パターンごとに独立して判定：今の周でまだ終わっていなければ小さいリストに、
  // すでに終わっていれば次の周でまた始まるまでのマイナスカウントダウンを
  // 大きな時計表示の専用カードで見せる（waitingPatterns）。
  timelineBlocks.forEach(b => {
    if (cyclePos < b.endSec) {
      activePatternHeaders.push(b.header);
    } else {
      const remain = (b.startSec + cycleLen) - cyclePos;
      waitingPatterns.push({ header: b.header, remain });
    }
  });

  // 1分以内に発起する人・発起時刻を過ぎてから1分以内の人（出せなかった可能性がある人）を仕分けする
  if (timelineLines.length) {
    function remainOf(sec) {
      return sec >= cyclePos ? sec - cyclePos : (sec + cycleLen) - cyclePos;
    }
    currentCycleIndex = Math.floor((elapsedSec - firstStart) / cycleLen);

    function overrideFor(line) {
      const o = rallyOverrides[line.symbol + "|" + line.label];
      return (o && o.cycleIndex === currentCycleIndex) ? o : null;
    }
    // 「時短で出す」を選んだ人は、その選んだ集結時間ぶん発起時刻が後ろにずれたものとして扱う
    function effectiveLaunchAndRally(line) {
      const o = overrideFor(line);
      if (o && line.rallyMin != null) {
        return { launchSec: line.launchSec + (line.rallyMin - o.rallyMin) * 60, rallyMin: o.rallyMin };
      }
      return { launchSec: line.launchSec, rallyMin: line.rallyMin };
    }
    // 本来の集結時間より短縮できる時間（1,3,5分のうち本来以下のもの）の、今から見た発起までの秒数
    function buildAlts(launchSec, rallyMin) {
      if (rallyMin == null) return [];
      return ALT_RALLY_MINUTES
        .filter(min => min <= rallyMin)
        .sort((a, b) => b - a)
        .map(min => ({
          min,
          remain: Math.round(remainOf(launchSec + (rallyMin - min) * 60)),
          isOriginal: min === rallyMin,
        }));
    }

    // 1分以内に発起する人（「時短で出す」を選んだ人はその新しい時刻で判定）
    const upcomingGroups = new Map(); // 秒数（丸め）-> {names, rallyMin, launchSec}
    timelineLines.forEach(line => {
      const eff = effectiveLaunchAndRally(line);
      const remain = remainOf(eff.launchSec);
      if (remain > UPCOMING_LAUNCH_WINDOW_SEC) return;
      const key = Math.round(remain);
      if (!upcomingGroups.has(key)) upcomingGroups.set(key, { names: [], rallyMin: eff.rallyMin, launchSec: eff.launchSec });
      upcomingGroups.get(key).names.push(`${line.symbol}${line.label}`);
    });
    if (upcomingGroups.size) {
      upcomingLaunch = Array.from(upcomingGroups.entries())
        .sort((a, b) => a[0] - b[0])
        .map(([remain, g]) => ({ remain, names: g.names, rallyMin: g.rallyMin, alts: buildAlts(g.launchSec, g.rallyMin) }));
    }

    // 本来の発起時刻を過ぎてから1分以内の人（「時短で出す」を選んで対応済みの人は除く）
    const missedGroups = new Map(); // 経過秒数（丸め）-> {names, keys, rallyMin, launchSec}
    timelineLines.forEach(line => {
      if (overrideFor(line)) return;
      const remain = remainOf(line.launchSec);
      const elapsedSince = cycleLen - remain;
      if (remain <= UPCOMING_LAUNCH_WINDOW_SEC || elapsedSince > UPCOMING_LAUNCH_WINDOW_SEC) return;
      const key = Math.round(elapsedSince);
      if (!missedGroups.has(key)) missedGroups.set(key, { names: [], keys: [], rallyMin: line.rallyMin, launchSec: line.launchSec });
      const g = missedGroups.get(key);
      g.names.push(`${line.symbol}${line.label}`);
      g.keys.push(line.symbol + "|" + line.label);
    });
    if (missedGroups.size) {
      missedLaunches = Array.from(missedGroups.entries())
        .sort((a, b) => a[0] - b[0])
        .map(([elapsedSince, g]) => ({ elapsedSince, names: g.names, keys: g.keys, alts: buildAlts(g.launchSec, g.rallyMin) }));
    }
  }
}

function applyRallyOverride(keys, min) {
  keys.forEach(key => { rallyOverrides[key] = { cycleIndex: currentCycleIndex, rallyMin: min }; });
  renderTimelineStatus();
  renderStack();
}

loadTabs();
renderTabBar();
loadSettings();
try { applySideHidden(localStorage.getItem(sideHiddenKeyFor(currentTabId)) === "1"); } catch (e) {}
loadPasteBox();
reparseTimeline();
autoSyncSiegeData();
</script>

</body>
</html>
