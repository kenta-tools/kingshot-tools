<button type="button" class="ks-open-btn" onclick="ksToggleSidebar()" aria-label="メニューを開く">☰</button>
<script>
(function() {
  var collapsed = false;
  try { collapsed = localStorage.getItem("ksSidebarCollapsed") === "1"; } catch (e) {}
  function applyBtn() {
    var btn = document.getElementById("ksToggleBtn");
    if (btn) btn.textContent = document.body.classList.contains("ks-collapsed") ? "→" : "←";
  }
  if (collapsed) document.body.classList.add("ks-collapsed");
  document.addEventListener("DOMContentLoaded", applyBtn);
  applyBtn();
  window.ksToggleSidebar = function() {
    var next = !document.body.classList.contains("ks-collapsed");
    document.body.classList.toggle("ks-collapsed", next);
    try { localStorage.setItem("ksSidebarCollapsed", next ? "1" : "0"); } catch (e) {}
    applyBtn();
  };
  // スマホ幅のメニュー：☰で開閉。開いているときにメニューの外をタップしたら閉じ、そのタップは下の画面に通さない
  function setMenuOpen(open) {
    document.body.classList.toggle("ks-menu-open", open);
    document.querySelectorAll(".ks-menu-btn").forEach(function(b) {
      b.textContent = open ? "✕" : "☰";
      b.setAttribute("aria-expanded", open ? "true" : "false");
    });
  }
  function outsideMenu(t) {
    return document.body.classList.contains("ks-menu-open") && !(t.closest && (t.closest(".ks-sidebar nav") || t.closest(".ks-menu-btn")));
  }
  window.addEventListener("mousedown", function(e) { if (outsideMenu(e.target)) e.preventDefault(); }, true);
  window.addEventListener("click", function(e) {
    if (e.target.closest && e.target.closest(".ks-menu-btn")) { setMenuOpen(!document.body.classList.contains("ks-menu-open")); return; }
    if (outsideMenu(e.target)) { e.preventDefault(); e.stopPropagation(); setMenuOpen(false); }
  }, true);
})();
</script>

<div class="main">
<h1>⏱️ ストップウォッチ（メモ付き）</h1>
<div class="sub">計測中に「記録」を押すと、その時点のタイムを一覧に残せます。メモは記録時にも、あとからも書き換えられます（このブラウザに自動保存）。</div>
<div class="card">
  <div class="mode-row">
    <label><input type="radio" name="mode" value="up" checked> カウントアップ</label>
    <label><input type="radio" name="mode" value="down"> カウントダウン</label>
    <span id="downSet" style="display:none"><input id="mm" type="number" min="0" max="999" value="1"> 分 <input id="ss" type="number" min="0" max="59" value="0"> 秒から</span>
  </div>
  <div id="time">00:00.00</div>
  <button id="startBtn">スタート</button>
  <button id="lapBtn" class="sub2" disabled>記録</button>
  <button id="resetBtn" class="sub2">リセット</button>
  <div class="memo-row"><input id="memo" type="text" placeholder="記録に付けるメモ（任意）" maxlength="60"></div>
</div>
<table>
  <thead><tr><th>#</th><th>タイム</th><th>経過差</th><th>メモ</th><th></th></tr></thead>
  <tbody id="laps"></tbody>
</table>
</div>
<script>
(function () {
  var KEY = "kingshot_stopwatch_v1";
  var mode = "up", elapsed = 0, startAt = 0, running = false, raf = 0, laps = [];
  var $ = function (id) { return document.getElementById(id); };
  function fmt(ms) {
    var cs = Math.floor(ms / 10) % 100, s = Math.floor(ms / 1000) % 60, m = Math.floor(ms / 60000);
    return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0") + "." + String(cs).padStart(2, "0");
  }
  function now() { return elapsed + (running ? Date.now() - startAt : 0); }
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ laps: laps })); } catch (e) {} }
  function load() { try { var d = JSON.parse(localStorage.getItem(KEY) || "{}"); laps = d.laps || []; } catch (e) { laps = []; } }
  function target() { return ((+$("mm").value || 0) * 60 + (+$("ss").value || 0)) * 1000; }
  function shown(e) { return mode === "down" ? Math.max(0, target() - e) : e; }
  function tick() {
    var e = now();
    if (mode === "down" && running && e >= target()) {
      elapsed = target(); running = false; cancelAnimationFrame(raf);
      $("startBtn").textContent = "再開"; $("startBtn").className = ""; $("startBtn").disabled = true; $("time").classList.add("done");
      try { var c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(); o.connect(c.destination); o.frequency.value = 880; o.start(); o.stop(c.currentTime + 0.6); } catch (x) {}
      e = target();
    }
    $("time").textContent = fmt(shown(e)); if (running) raf = requestAnimationFrame(tick);
  }
  function setMode(m) {
    if (running || elapsed > 0) { if (!confirm("計測中のタイムをリセットして切り替えます。よろしいですか？")) { document.querySelector('input[name=mode][value=' + mode + ']').checked = true; return; } }
    mode = m; running = false; cancelAnimationFrame(raf); elapsed = 0; laps = []; save(); render();
    $("downSet").style.display = m === "down" ? "inline" : "none";
    $("startBtn").textContent = "スタート"; $("startBtn").className = ""; $("startBtn").disabled = false; $("lapBtn").disabled = true; $("time").classList.remove("done"); tick();
  }
  Array.prototype.forEach.call(document.querySelectorAll("input[name=mode]"), function (r) { r.addEventListener("change", function () { setMode(r.value); }); });
  ["mm", "ss"].forEach(function (id) { $(id).addEventListener("input", function () { if (!running && elapsed === 0) tick(); }); });
  function render() {
    var tb = $("laps"); tb.innerHTML = "";
    if (!laps.length) { tb.innerHTML = '<tr><td colspan="5" class="empty">まだ記録はありません</td></tr>'; return; }
    laps.forEach(function (l, i) {
      var tr = document.createElement("tr");
      var diff = i === 0 ? l.t : l.t - laps[i - 1].t;
      tr.innerHTML = '<td>' + (i + 1) + '</td><td class="t">' + fmt(l.d != null ? l.d : l.t) + '</td><td class="t">+' + fmt(diff) + '</td><td><input type="text" maxlength="60"></td><td><button class="del" title="削除">✕</button></td>';
      var inp = tr.querySelector("input"); inp.value = l.memo || "";
      inp.addEventListener("input", function () { l.memo = inp.value; save(); });
      tr.querySelector(".del").addEventListener("click", function () { laps.splice(i, 1); save(); render(); });
      tb.appendChild(tr);
    });
  }
  $("startBtn").addEventListener("click", function () {
    if (!running) { running = true; startAt = Date.now(); $("startBtn").textContent = "ストップ"; $("startBtn").className = "stop"; $("lapBtn").disabled = false; tick(); }
    else { elapsed += Date.now() - startAt; running = false; cancelAnimationFrame(raf); $("startBtn").textContent = "再開"; $("startBtn").className = ""; tick(); }
  });
  $("lapBtn").addEventListener("click", function () {
    laps.push({ t: now(), d: shown(now()), memo: $("memo").value }); $("memo").value = ""; save(); render();
  });
  $("resetBtn").addEventListener("click", function () {
    if (laps.length && !confirm("タイムと記録をすべて消します。よろしいですか？")) return;
    running = false; cancelAnimationFrame(raf); elapsed = 0; laps = []; save(); render();
    $("startBtn").textContent = "スタート"; $("startBtn").className = ""; $("startBtn").disabled = false; $("lapBtn").disabled = true; $("time").classList.remove("done"); tick();
  });
  load(); render(); tick();
})();
</script>
